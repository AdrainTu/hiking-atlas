services:
  - type: web
    name: hiking-atlas
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python production.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: DATABASE_URL
        sync: false
