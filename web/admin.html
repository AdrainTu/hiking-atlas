<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野途 · 数据管理</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="admin.css"><script src="route-manager.js" defer></script><script src="admin.js" defer></script></head><body><main><header><div><small>TRAIL ATLAS / DATA STUDIO</small><h1>山野数据管理</h1><p id="identity">正在核验管理员权限…</p></div><a href="/">← 返回地图</a></header><p id="status" role="status" aria-live="polite"></p><div id="workspace" hidden><section class="cards" id="counts"></section><nav id="tabs" aria-label="数据栏目"></nav><section class="panel"><div class="admin-toolbar"><h2 id="table-title"></h2><form id="search-form"><input id="search" maxlength="100" placeholder="输入关键词搜索" aria-label="搜索数据"><button>搜索</button></form><button id="create-route" type="button" hidden>＋ 新增线路</button><select id="route-status-filter" hidden aria-label="线路状态筛选"><option value="">全部状态</option><option value="published">已上架</option><option value="draft">草稿</option><option value="archived">已下架</option></select><button id="refresh" type="button">↻ 刷新</button><button id="export" type="button">导出当前页 CSV</button></div><p id="table-note"></p><div class="admin-table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="admin-pagination"><button id="previous">← 上一页</button><span id="page-info"></span><button id="next">下一页 →</button></div></section><p class="admin-hint">“线路管理”统一维护精选线路与用户投稿，草稿和下架线路不对外展示。访问统计请打开 <a href="/dashboard.html">统计 Dashboard</a>。密码、会话和数据库连接信息不会在本后台显示。</p></div></main><dialog id="record-dialog"><div class="dialog-top"><h2 id="record-title">记录详情</h2><button id="close-dialog" type="button" aria-label="关闭">×</button></div><div id="record-detail"></div><form id="operation-form"><div id="edit-fields"></div><label>操作<select id="action"></select></label><label>操作原因<textarea id="reason" minlength="2" maxlength="400" rows="2" required></textarea></label><div id="impact"></div><label id="confirmation-label" hidden>确认删除<input id="confirmation" autocomplete="off"></label><p id="operation-error" role="status"></p><button id="save" type="submit">确认执行</button></form></dialog></body></html>
